    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;

        }

        /* 1. Dynamic Smooth Gradient Animation */
        .dynamic-gradient {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #030712);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. Floating Wallpaper Gallery Effect */
        .gallery-track {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: scrollGallery 25s linear infinite;
        }
        .gallery-track-reverse {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: scrollGalleryReverse 25s linear infinite;
        }

        @keyframes scrollGallery {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        @keyframes scrollGalleryReverse {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }

        /* 3. Pure Glassmorphism Central Card */
        .glass-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* 4. Glowing Neon Button Style */
        .glow-btn {
            background: linear-gradient(135deg, #2563eb, #9333ea, #db2777);
            background-size: 200% auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.4);
        }
        .glow-btn:hover {
            background-position: right center;
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 0 40px rgba(147, 51, 234, 0.7), 0 0 15px rgba(37, 99, 235, 0.5);
        }
    </style>

        <!-- Timer Notification -->
        <div class="text-xs text-slate-500 font-medium tracking-wide">
            Automating redirect in <span id="countdown" class="text-blue-400 font-bold text-sm">5</span> seconds...
        </div>
    </div>

    <script>
        const targetURL = "https://new-wallpaper-website.vercel.app/";
        let timeLeft = 5;
        const countdownElement = document.getElementById('countdown');

        // Countdown Timer Logic
        const downloadTimer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(downloadTimer);
                window.location.href = targetURL;
            }
        }, 1000);
    </script>
